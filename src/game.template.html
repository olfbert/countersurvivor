<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="C-Survivors">
<meta name="theme-color" content="#1c1f17">
<title>Counter-Survivors · de_dust</title>
<style>
  :root { --hud: #ffb43c; --panel: rgba(28, 31, 23, .86); --line: rgba(255, 180, 60, .35); --txt: #e8dcc2; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; position: fixed; inset: 0;
    font-family: Tahoma, Verdana, "Segoe UI", sans-serif; color: var(--txt);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .safe { position: absolute; inset: 0; pointer-events: none;
    padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
  button { font: inherit; font-size: 14px; color: var(--txt); background: var(--panel); border: 1px solid var(--line);
    border-radius: 3px; padding: 9px 14px; min-height: 38px; cursor: pointer; pointer-events: auto; }
  button:active { background: rgba(255, 180, 60, .28); }
  button.on { color: #1c1f17; background: var(--hud); }
  /* HUD */
  #hud { display: none; }
  #hud.show { display: block; }
  #menuBtn { position: absolute; top: max(8px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); min-width: 44px; font-size: 18px; padding: 4px 10px; }
  #stats { position: absolute; top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); text-align: right;
    font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; color: var(--hud); text-shadow: 0 1px 2px #000; pointer-events: none; }
  #cross { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
  #cross i { position: absolute; background: #32fa32; box-shadow: 0 0 1px rgba(0,0,0,.8); }
  #cross i:nth-child(1) { left: -1px; top: -14px; width: 2px; height: 8px; }
  #cross i:nth-child(2) { left: -1px; top: 6px; width: 2px; height: 8px; }
  #cross i:nth-child(3) { top: -1px; left: -14px; width: 8px; height: 2px; }
  #cross i:nth-child(4) { top: -1px; left: 6px; width: 8px; height: 2px; }
  #speedo { position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    font: bold 20px Tahoma, Verdana, sans-serif; color: var(--hud); opacity: .9; text-shadow: 0 1px 3px #000; pointer-events: none; }
  #speedo small { font-size: 11px; font-weight: normal; opacity: .8; }
  #jumpBtn { position: absolute; right: max(26px, calc(env(safe-area-inset-right) + 16px)); bottom: max(26px, calc(env(safe-area-inset-bottom) + 16px));
    width: 76px; height: 76px; border-radius: 50%; font-size: 13px; letter-spacing: .05em; background: rgba(28, 31, 23, .55); display: none; }
  .touch #jumpBtn { display: block; }
  #stick { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border: 2px solid rgba(255, 255, 255, .28);
    border-radius: 50%; display: none; pointer-events: none; }
  #stick i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(255, 255, 255, .3); }
  #toast { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); padding: 8px 14px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 3px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; }
  /* Overlays */
  .overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10, 11, 8, .72); z-index: 3; }
  .overlay.show { display: flex; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 16px 18px; max-width: min(92vw, 560px);
    max-height: calc(100% - 24px); overflow: auto; pointer-events: auto; }
  .box h1 { margin: 0 0 2px; font-size: 22px; letter-spacing: .14em; color: var(--hud); }
  .box h2 { margin: 14px 0 6px; font-size: 12px; letter-spacing: .12em; color: var(--hud); font-weight: bold; text-transform: uppercase; }
  .box p { margin: 6px 0; font-size: 13px; line-height: 1.45; }
  .muted { opacity: .65; font-size: 11px !important; }
  .grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .rowline { display: flex; align-items: center; gap: 10px; font-size: 13px; margin: 6px 0; }
  .rowline input[type=range] { flex: 1; accent-color: var(--hud); pointer-events: auto; }
  #start { background: radial-gradient(ellipse at center, rgba(28,31,23,.55), rgba(10,11,8,.92)); }
  #start .box { text-align: center; }
  #startBtn { font-size: 16px; padding: 12px 34px; margin-top: 10px; color: #1c1f17; background: var(--hud); font-weight: bold; letter-spacing: .1em; }
  #startBtn:disabled { opacity: .5; }
  .barwrap { width: 240px; height: 6px; border: 1px solid var(--line); margin: 12px auto 4px; }
  .barfill { height: 100%; width: 0; background: var(--hud); transition: width .15s; }
  #err { color: #ff7b6b; font: 12px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; text-align: left; }
  #portrait { position: absolute; left: 0; right: 0; bottom: 30%; text-align: center; font-size: 13px; color: var(--hud); display: none; pointer-events: none; text-shadow: 0 1px 3px #000; }
  @media (orientation: portrait) and (pointer: coarse) { #portrait { display: block; } }
</style>

<body>
<canvas id="c"></canvas>
<div id="stick"><i></i></div>

<div id="hud">
  <div id="cross"><i></i><i></i><i></i><i></i></div>

<div class="overlay show" id="start">
  <div class="box">

    <div style="text-align:center;margin-top:12px"><button id="resumeBtn" class="on" style="min-width:160px;font-weight:bold">WEITER</button></div>
  </div>
</div>

<script id="pack" type="application/octet-stream">__PACK__</script>
<script>
'use strict';
// =====================================================================
// Counter-Survivors · Phase 1: de_dust begehbar
// BSP v30 wird zur Laufzeit gelesen: Geometrie, Lightmaps, Kollision, Entities.
// Koordinaten wie in GoldSrc: Z zeigt nach oben, 1 Einheit ~ 1 Zoll.
// =====================================================================
const VERSION = '__VERSION__';
const $ = s => document.querySelector(s);
const err = msg => { $('#start').classList.add('show'); $('#err').textContent += msg + '\n'; };
addEventListener('error', e => err('Fehler: ' + e.message + (e.lineno ? ' (Zeile ' + e.lineno + ')' : '')));
addEventListener('unhandledrejection', e => err('Fehler: ' + (e.reason && e.reason.message || e.reason)));

const IS_TOUCH = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (IS_TOUCH) document.body.classList.add('touch');

const canvas = $('#c');
const gl = canvas.getContext('webgl2', { antialias: true, alpha: false, powerPreference: 'high-performance' });
if (!gl) { err('WebGL2 wird auf diesem Gerät nicht unterstützt.'); throw new Error('no webgl2'); }
const aniso = gl.getExtension('EXT_texture_filter_anisotropic');

// ---------------------------------------------------------------- Einstellungen (lokal, optional)
const SETTINGS_KEY = 'countersurvivors.settings.v1';
const settings = Object.assign({ sens: 1, res: 1, fps: true, autoBhop: false }, (() => {
  try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; } catch (e) { return {}; }
})());
const saveSettings = () => { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) { /* egal */ } };
const RESOLUTIONS = [1, 0.75, 0.5];

// ---------------------------------------------------------------- Mathe
const M4 = {
  persp(fovy, aspect, n, f) {
    const t = 1 / Math.tan(fovy / 2);
    return new Float32Array([t / aspect, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) / (n - f), -1, 0, 0, 2 * f * n / (n - f), 0]);
  },
  // Blickrichtung aus Gier/Neigung, Z oben
  view(eye, yaw, pitch) {
    const cp = Math.cos(pitch), sp = Math.sin(pitch), cy = Math.cos(yaw), sy = Math.sin(yaw);
    const f = [cy * cp, sy * cp, sp];          // vorwaerts
    const r = [sy, -cy, 0];                     // rechts
    const u = [-cy * sp, -sy * sp, cp];         // oben = r x f
    return new Float32Array([
      r[0], u[0], -f[0], 0,
      r[1], u[1], -f[1], 0,
      r[2], u[2], -f[2], 0,
      -(r[0] * eye[0] + r[1] * eye[1] + r[2] * eye[2]),
      -(u[0] * eye[0] + u[1] * eye[1] + u[2] * eye[2]),
      (f[0] * eye[0] + f[1] * eye[1] + f[2] * eye[2]), 1]);
  },
  mul(a, b) {
    const o = new Float32Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++)
      o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
    return o;
  },
};

// ---------------------------------------------------------------- Shader
function program(vs, fs) {
  const mk = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const p = gl.createProgram();
  gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  for (let i = 0, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i < n; i++) {
    const a = gl.getActiveUniform(p, i); u[a.name] = gl.getUniformLocation(p, a.name);
  }
  return { p, u };
}

// Welt: Textur x Lightmap. Helligkeit nach GoldSrc-Art (Lightmap leicht aufgehellt, Gamma)
const progWorld = program(`#version 300 es
precision highp float;
layout(location=0) in vec3 aPos; layout(location=1) in vec2 aUV; layout(location=2) in vec2 aLM;
uniform mat4 uVP;
out vec2 vUV; out vec2 vLM;
void main() { vUV = aUV; vLM = aLM; gl_Position = uVP * vec4(aPos, 1.0); }`,
`#version 300 es
precision mediump float;
in vec2 vUV; in vec2 vLM;
uniform sampler2D uTex; uniform sampler2D uLM;
uniform float uAlpha; uniform float uMasked; uniform vec3 uLight;
out vec4 o;
void main() {
  vec4 t = texture(uTex, vUV);
  if (uMasked > 0.5 && t.a < 0.5) discard;
  vec3 lm = pow(texture(uLM, vLM).rgb, vec3(uLight.y)) * uLight.x;
  vec3 c = t.rgb * lm;
  c = pow(c, vec3(uLight.z));
  o = vec4(c, uAlpha);
}`);

const progSky = program(`#version 300 es
precision highp float;
layout(location=0) in vec3 aPos; layout(location=1) in vec2 aUV;
uniform mat4 uVP; out vec2 vUV;
void main() { vUV = aUV; gl_Position = (uVP * vec4(aPos, 1.0)).xyww; }`,
`#version 300 es
precision mediump float;
in vec2 vUV; uniform sampler2D uTex; out vec4 o;
void main() { o = vec4(texture(uTex, vUV).rgb, 1.0); }`);

// ---------------------------------------------------------------- Paket laden
async function loadPack() {
  const b64 = $('#pack').textContent.trim();
  const bin = atob(b64), raw = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) raw[i] = bin.charCodeAt(i);
  const buf = raw[0] === 0x1f && raw[1] === 0x8b
    ? await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()
    : raw.buffer;
  const jl = new DataView(buf).getUint32(0, true);
  const man = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, jl)));
  const base = 4 + jl;
  return { man, part: ([o, l]) => buf.slice(base + o, base + o + l) };
}

async function loadTexture(bytes, type, { repeat = true, mips = true } = {}) {
  const bmp = await createImageBitmap(new Blob([bytes], { type }), { premultiplyAlpha: 'none', colorSpaceConversion: 'none' });
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, bmp);
  if (mips) gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mips ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  const wrap = repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
  if (aniso && mips) gl.texParameterf(gl.TEXTURE_2D, aniso.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(8, gl.getParameter(aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
  const w = bmp.width, h = bmp.height;
  if (bmp.close) bmp.close();
  return { tex: t, w, h };
}

// =====================================================================
// BSP v30
// =====================================================================
const CONTENTS_EMPTY = -1, CONTENTS_SOLID = -2;
const TOOL_TEX = new Set(['hint', 'skip', 'clip', 'null', 'origin', 'aaatrigger', 'bevel']);
const HIDDEN_CLASSES = new Set(['func_bomb_target', 'func_buyzone', 'func_hostage_rescue', 'func_vip_safetyzone', 'func_escapezone', 'func_ladder', 'func_mortar_field']);
const NONSOLID_CLASSES = new Set(['func_illusionary']);

function parseEntities(text) {
  const ents = [];
  const re = /\{([^}]*)\}/g; let m;
  while ((m = re.exec(text))) {
    const e = {}; const kv = /"([^"]*)"\s+"([^"]*)"/g; let k;
    while ((k = kv.exec(m[1]))) e[k[1]] = k[2];
    ents.push(e);
  }
  return ents;
}
const vec3 = s => (s || '0 0 0').trim().split(/\s+/).map(Number);

function parseBSP(buf) {
  const dv = new DataView(buf);
  const ver = dv.getInt32(0, true);
  if (ver !== 30) throw new Error('Nicht unterstützte BSP-Version ' + ver);
  const L = []; for (let i = 0; i < 15; i++) L.push([dv.getInt32(4 + i * 8, true), dv.getInt32(8 + i * 8, true)]);
  const bsp = {};
  bsp.entities = parseEntities(new TextDecoder('latin1').decode(new Uint8Array(buf, L[0][0], L[0][1])));
  // Ebenen
  { const [o, l] = L[1], n = l / 20; bsp.planes = { n: new Float32Array(n * 3), d: new Float32Array(n), type: new Int32Array(n) };
    for (let i = 0; i < n; i++) { const b = o + i * 20;
      bsp.planes.n[i * 3] = dv.getFloat32(b, true); bsp.planes.n[i * 3 + 1] = dv.getFloat32(b + 4, true); bsp.planes.n[i * 3 + 2] = dv.getFloat32(b + 8, true);
      bsp.planes.d[i] = dv.getFloat32(b + 12, true); bsp.planes.type[i] = dv.getInt32(b + 16, true); } }
  // Texturen (nur Namen und Maße)
  { const [o] = L[2], n = dv.getInt32(o, true); bsp.miptex = [];
    for (let i = 0; i < n; i++) { const off = dv.getInt32(o + 4 + i * 4, true);
      if (off < 0) { bsp.miptex.push({ name: '', w: 16, h: 16 }); continue; }
      const b = o + off; let name = '';
      for (let k = 0; k < 16; k++) { const c = dv.getUint8(b + k); if (!c) break; name += String.fromCharCode(c); }
      bsp.miptex.push({ name: name.toLowerCase(), w: dv.getUint32(b + 16, true), h: dv.getUint32(b + 20, true) }); } }
  // Vertices
  { const [o, l] = L[3]; bsp.verts = new Float32Array(buf.slice(o, o + l)); }
  // Knoten (Hull 0)
  { const [o, l] = L[5], n = l / 24; bsp.nodes = { plane: new Int32Array(n), c0: new Int32Array(n), c1: new Int32Array(n) };
    for (let i = 0; i < n; i++) { const b = o + i * 24; bsp.nodes.plane[i] = dv.getInt32(b, true);
      bsp.nodes.c0[i] = dv.getInt16(b + 4, true); bsp.nodes.c1[i] = dv.getInt16(b + 6, true); } }
  // Texinfo
  { const [o, l] = L[6], n = l / 40; bsp.texinfo = { v: new Float32Array(n * 8), mip: new Int32Array(n), flags: new Int32Array(n) };
    for (let i = 0; i < n; i++) { const b = o + i * 40;
      for (let k = 0; k < 8; k++) bsp.texinfo.v[i * 8 + k] = dv.getFloat32(b + k * 4, true);
      bsp.texinfo.mip[i] = dv.getInt32(b + 32, true); bsp.texinfo.flags[i] = dv.getInt32(b + 36, true); } }
  // Flaechen
  { const [o, l] = L[7], n = l / 20; bsp.faces = [];
    for (let i = 0; i < n; i++) { const b = o + i * 20;
      bsp.faces.push({ plane: dv.getUint16(b, true), side: dv.getInt16(b + 2, true), firstEdge: dv.getInt32(b + 4, true), numEdges: dv.getInt16(b + 8, true),
        texinfo: dv.getInt16(b + 10, true), style0: dv.getUint8(b + 12), lightofs: dv.getInt32(b + 16, true) }); } }
  { const [o, l] = L[8]; bsp.lighting = new Uint8Array(buf, o, l); }
  // Clipnodes (Hulls 1-3)
  { const [o, l] = L[9], n = l / 8; bsp.clip = { plane: new Int32Array(n), c0: new Int32Array(n), c1: new Int32Array(n) };
    for (let i = 0; i < n; i++) { const b = o + i * 8; bsp.clip.plane[i] = dv.getInt32(b, true);
      bsp.clip.c0[i] = dv.getInt16(b + 4, true); bsp.clip.c1[i] = dv.getInt16(b + 6, true); } }
  // Blaetter (nur Inhalt fuer Hull 0)
  { const [o, l] = L[10], n = l / 28; bsp.leafContents = new Int32Array(n);
    for (let i = 0; i < n; i++) bsp.leafContents[i] = dv.getInt32(o + i * 28, true); }
  { const [o, l] = L[12]; bsp.edges = new Uint16Array(buf.slice(o, o + l)); }
  { const [o, l] = L[13]; bsp.surfedges = new Int32Array(buf.slice(o, o + l)); }
  // Modelle
  { const [o, l] = L[14], n = l / 64; bsp.models = [];
    for (let i = 0; i < n; i++) { const b = o + i * 64, f = k => dv.getFloat32(b + k * 4, true);
      bsp.models.push({ mins: [f(0), f(1), f(2)], maxs: [f(3), f(4), f(5)], origin: [f(6), f(7), f(8)],
        head: [dv.getInt32(b + 36, true), dv.getInt32(b + 40, true), dv.getInt32(b + 44, true), dv.getInt32(b + 48, true)],
        firstFace: dv.getInt32(b + 56, true), numFaces: dv.getInt32(b + 60, true) }); } }
  // Hull 0 in Clipnode-Form bringen: Kind < 0 -> Inhalt des Blattes
  { const N = bsp.nodes, n = N.plane.length;
    const c0 = new Int32Array(n), c1 = new Int32Array(n);
    for (let i = 0; i < n; i++) {
      c0[i] = N.c0[i] >= 0 ? N.c0[i] : bsp.leafContents[-1 - N.c0[i]];
      c1[i] = N.c1[i] >= 0 ? N.c1[i] : bsp.leafContents[-1 - N.c1[i]];
    }
    bsp.hull0 = { plane: N.plane, c0, c1 }; }
  return bsp;
}

// Flaechen-Vertices in Reihenfolge
function faceVerts(bsp, f) {
  const out = [];
  for (let k = 0; k < f.numEdges; k++) {
    const e = bsp.surfedges[f.firstEdge + k];
    const vi = e >= 0 ? bsp.edges[e * 2] : bsp.edges[-e * 2 + 1];
    out.push([bsp.verts[vi * 3], bsp.verts[vi * 3 + 1], bsp.verts[vi * 3 + 2]]);
  }
  return out;
}

// ---------------------------------------------------------------- Welt-Geometrie + Lightmap-Atlas
function buildWorld(bsp, textures) {
  const LM_W = 2048;
  // 1) Welche Modelle werden gezeichnet, mit welchen Render-Einstellungen?
  const drawModels = [{ model: 0, origin: [0, 0, 0], mode: 0, amt: 255 }];
  for (const e of bsp.entities) {
    if (!e.model || e.model[0] !== '*') continue;
    const cls = e.classname || '';

  ws = Math.min(ws, 1) * MOVE.maxspeed;
  if (p.onGround) { accelerate(wishdir, ws, MOVE.accelerate, dt, false); walkMove(dt); }
  else { accelerate(wishdir, ws, MOVE.airaccelerate, dt, true); flyMove(dt); }
  for (let i = 0; i < 3; i++) p.v[i] = Math.max(-MOVE.maxvel, Math.min(MOVE.maxvel, p.v[i]));
  categorize();
  if (!p.onGround) p.v[2] -= MOVE.gravity * 0.5 * dt; else p.v[2] = 0;
  // Notbremse: aus der Map gefallen -> zurueck zum Start
  if (p.o[2] < -4000) teleport('ct');
}

// =====================================================================
// Map-Punkte: Spawns und Bombsites
// =====================================================================
let SPOTS = {};
function dropToFloor(x, y, zTop, zBottom) {
  // freie Position suchen und auf den Boden setzen
  for (const [dx, dy] of [[0, 0], [24, 0], [-24, 0], [0, 24], [0, -24], [48, 48], [-48, -48], [48, -48], [-48, 48]]) {
    const s = [x + dx, y + dy, zTop];
    const tr = trace(s, [s[0], s[1], zBottom]);
    if (!tr.startsolid && tr.fraction < 1) return tr.endpos;
  }
  return [x, y, zTop];
}
function findSpots() {
  const E = BSP.entities;
  const ct = E.filter(e => e.classname === 'info_player_start').map(e => ({ o: vec3(e.origin), yaw: vec3(e.angles)[1] }));
  const t = E.filter(e => e.classname === 'info_player_deathmatch').map(e => ({ o: vec3(e.origin), yaw: vec3(e.angles)[1] }));
  const spot = (list) => {
    if (!list.length) return null;
    const s = list[0];
    return { o: dropToFloor(s.o[0], s.o[1], s.o[2] + 2, s.o[2] - 200), yaw: s.yaw * Math.PI / 180 };
  };
  SPOTS.ct = spot(ct); SPOTS.t = spot(t);
  // Bombsites: Mittelpunkt der Zone, Name ueber die {siteA/{siteB-Decals bestimmen
  const sites = E.filter(e => e.classname === 'func_bomb_target' && e.model).map(e => {
    const m = BSP.models[+e.model.slice(1)];
    return { c: [(m.mins[0] + m.maxs[0]) / 2, (m.mins[1] + m.maxs[1]) / 2], m };
  });
  const decals = E.filter(e => e.classname === 'infodecal' && /site[ab]/i.test(e.texture || '')).map(e => ({ o: vec3(e.origin), name: /sitea/i.test(e.texture) ? 'a' : 'b' }));
  sites.forEach((s, i) => {
    let name = i === 0 ? 'a' : 'b', best = Infinity;
    for (const d of decals) { const dd = Math.hypot(d.o[0] - s.c[0], d.o[1] - s.c[1]); if (dd < best) { best = dd; name = d.name; } }
    const fromCt = SPOTS.ct ? Math.atan2(s.c[1] - SPOTS.ct.o[1], s.c[0] - SPOTS.ct.o[0]) : 0;
    SPOTS[name] = { o: dropToFloor(s.c[0], s.c[1], s.m.maxs[2] - 40, s.m.mins[2] - 128), yaw: fromCt };
  });
}
function teleport(name) {
  const s = SPOTS[name];
  if (!s) return;
  // minimal versetzt: Auge nie exakt ueber einem Eckpunkt (sonst Clipping-Sonderfall bei Blick geradeaus)
  player.o = [s.o[0] + 0.37, s.o[1] + 0.29, s.o[2]]; player.v = [0, 0, 0]; player.yaw = s.yaw; player.pitch = 0; player.stepSmooth = 0;
  toast({ ct: 'CT-Spawn', t: 'T-Spawn', a: 'Bombsite A', b: 'Bombsite B' }[name]);
}

// =====================================================================
// Eingabe
// =====================================================================
const stickEl = $('#stick'), stickKnob = $('#stick i');
let stick = null, look = null;
const keys = new Set();
let pointerLocked = false;
let playing = false;

canvas.addEventListener('pointerdown', e => {
  if (!playing) return;
  if (e.pointerType === 'mouse') {
    if (!pointerLocked && canvas.requestPointerLock) { try { const r = canvas.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (x) { /* Drag als Ersatz */ } }
    look = { id: e.pointerId, x: e.clientX, y: e.clientY };
    return;
  }
  canvas.setPointerCapture(e.pointerId);
  if (e.clientX < innerWidth * 0.42 && !stick) {
    stick = { id: e.pointerId, ox: e.clientX, oy: e.clientY };
    stickEl.style.display = 'block'; stickEl.style.left = e.clientX + 'px'; stickEl.style.top = e.clientY + 'px';
    stickKnob.style.transform = '';
  } else if (!look) look = { id: e.pointerId, x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointermove', e => {
  if (!playing) return;
  if (stick && stick.id === e.pointerId) {
    let sx = e.clientX - stick.ox, sy = e.clientY - stick.oy;
    const l = Math.hypot(sx, sy), max = 52;
    if (l > max) { sx *= max / l; sy *= max / l; }
    stickKnob.style.transform = `translate(${sx}px,${sy}px)`;
    let fx = -sy / max, sx2 = sx / max;
    const m = Math.hypot(fx, sx2);
    if (m < 0.15) { fx = 0; sx2 = 0; } else { const k = Math.min(1, (m - 0.15) / 0.75) / m; fx *= k; sx2 *= k; }
    input.fwd = fx; input.side = sx2;
  } else if (look && look.id === e.pointerId && !pointerLocked) {
    const dx = e.clientX - look.x, dy = e.clientY - look.y;
    look.x = e.clientX; look.y = e.clientY;
    const k = (e.pointerType === 'mouse' ? 0.0035 : 0.0058) * settings.sens;
    turn(dx * k, dy * k);
  }
});
const endPointer = e => {
  if (stick && stick.id === e.pointerId) { stick = null; stickEl.style.display = 'none'; input.fwd = input.side = 0; }
  if (look && look.id === e.pointerId) look = null;
};
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
document.addEventListener('pointerlockchange', () => { pointerLocked = document.pointerLockElement === canvas; });
document.addEventListener('mousemove', e => {
  if (!pointerLocked || !playing) return;
  const k = 0.0022 * settings.sens;
  turn(e.movementX * k, e.movementY * k);
});
function turn(dx, dy) {
  player.yaw -= dx;
  player.pitch = Math.max(-1.55, Math.min(1.55, player.pitch - dy));
}
addEventListener('keydown', e => {
  if (e.repeat) return;
  keys.add(e.code);
  if (e.code === 'Space') { player.jumpQueued = true; player.jumpHeld = true; e.preventDefault(); }
  if (e.code === 'Escape' || e.code === 'KeyP') togglePause();
});
addEventListener('keyup', e => { keys.delete(e.code); if (e.code === 'Space') player.jumpHeld = false; });
document.addEventListener('gesturestart', e => e.preventDefault());
const jumpBtn = $('#jumpBtn');
jumpBtn.addEventListener('pointerdown', e => { e.preventDefault(); player.jumpQueued = true; player.jumpHeld = true; });
const jumpUp = () => { player.jumpHeld = false; };
jumpBtn.addEventListener('pointerup', jumpUp); jumpBtn.addEventListener('pointercancel', jumpUp); jumpBtn.addEventListener('pointerleave', jumpUp);
function readKeys() {
  if (stick) return;
  let f = 0, s = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) f += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) f -= 1;
  if (keys.has('KeyD')) s += 1;
  if (keys.has('KeyA')) s -= 1;
  const walk = keys.has('ShiftLeft') || keys.has('ShiftRight') ? 0.52 : 1;
  input.fwd = f * walk; input.side = s * walk;
}

// =====================================================================
// UI
// =====================================================================
let toastTimer = 0;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}
const CTRL_TOUCH = 'Linker Daumen: laufen · rechter Daumen: umschauen · Knopf rechts unten: springen';
const CTRL_PC = 'WASD: laufen · Maus: umschauen (Klick fängt die Maus) · Leertaste: springen · Shift: gehen · Esc: Pause';
$('#ctrlHint').textContent = IS_TOUCH ? CTRL_TOUCH : CTRL_PC;
$('#ctrlHint2').textContent = IS_TOUCH ? CTRL_TOUCH : CTRL_PC;

function refreshMenu() {
  $('#sens').value = settings.sens; $('#sensVal').textContent = settings.sens.toFixed(2) + '×';
  $('#resBtn').textContent = 'Auflösung ' + Math.round(RESOLUTIONS[settings.res] * 100) + '%';
  $('#fpsBtn').textContent = 'fps-Anzeige: ' + (settings.fps ? 'an' : 'aus');
  $('#fpsBtn').classList.toggle('on', settings.fps);
  $('#bhopBtn').textContent = 'Auto-Bhop: ' + (settings.autoBhop ? 'an' : 'aus');
  $('#bhopBtn').classList.toggle('on', settings.autoBhop);
  $('#stats').style.display = settings.fps ? '' : 'none';
}
$('#sens').addEventListener('input', e => { settings.sens = +e.target.value; saveSettings(); refreshMenu(); });
$('#resBtn').addEventListener('click', () => { settings.res = (settings.res + 1) % RESOLUTIONS.length; saveSettings(); refreshMenu(); });
$('#fpsBtn').addEventListener('click', () => { settings.fps = !settings.fps; saveSettings(); refreshMenu(); });
$('#bhopBtn').addEventListener('click', () => { settings.autoBhop = !settings.autoBhop; saveSettings(); refreshMenu(); });
$('#menuBtn').addEventListener('click', () => togglePause(true));
$('#resumeBtn').addEventListener('click', () => togglePause(false));
function togglePause(on) {
  if (!$('#hud').classList.contains('show')) return;
  const show = on === undefined ? !$('#menu').classList.contains('show') : on;
  $('#menu').classList.toggle('show', show);
  playing = !show;
  if (show) { refreshMenu(); if (document.exitPointerLock && pointerLocked) document.exitPointerLock(); input.fwd = input.side = 0; stick = null; stickEl.style.display = 'none'; }
}
function buildTeleportButtons() {
  const g = $('#tpGrid'); g.innerHTML = '';
  for (const [k, label] of [['ct', 'CT-Spawn'], ['t', 'T-Spawn'], ['a', 'Bombsite A'], ['b', 'Bombsite B']]) {
    if (!SPOTS[k]) continue;
    const b = document.createElement('button'); b.textContent = label;
    b.addEventListener('click', () => { teleport(k); togglePause(false); });
    g.appendChild(b);
  }
}

// =====================================================================
// Rendern
// =====================================================================
let WORLD = null, SKY = null, SKYTEX = {}, TEX = {};
let aspect = 1;
const HFOV_43 = Math.PI / 2;
const VFOV = 2 * Math.atan(Math.tan(HFOV_43 / 2) * 3 / 4);   // CS: 90 Grad horizontal bei 4:3
const LIGHT = [1.55, 0.82, 1.0];   // Lightmap-Skalierung, Lightmap-Gamma, Endgamma
let fallbackTex = null;

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2) * RESOLUTIONS[settings.res];
  const w = Math.max(1, Math.round(canvas.clientWidth * dpr)), h = Math.max(1, Math.round(canvas.clientHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  aspect = w / h;
}

function render() {
  resize();
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  const p = player;
  const eye = [p.o[0], p.o[1], p.o[2] + MOVE.view + p.stepSmooth];
  const proj = M4.persp(VFOV, aspect, 4, 16000);
  // Himmel: nur Drehung
  gl.disable(gl.DEPTH_TEST); gl.depthMask(false); gl.disable(gl.CULL_FACE);
  gl.useProgram(progSky.p);
  gl.uniformMatrix4fv(progSky.u.uVP, false, M4.mul(proj, M4.view([0, 0, 0], p.yaw, p.pitch)));
  gl.uniform1i(progSky.u.uTex, 0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindVertexArray(SKY.vao);
  for (const [k, first] of Object.entries(SKY.ranges)) {
    if (!SKYTEX[k]) continue;
    gl.bindTexture(gl.TEXTURE_2D, SKYTEX[k].tex);
    gl.drawArrays(gl.TRIANGLES, first, 6);
  }
  // Welt
  const VP = M4.mul(proj, M4.view(eye, p.yaw, p.pitch));
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
  gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK); gl.frontFace(gl.CCW);
  gl.useProgram(progWorld.p);
  gl.uniformMatrix4fv(progWorld.u.uVP, false, VP);
  gl.uniform1i(progWorld.u.uTex, 0); gl.uniform1i(progWorld.u.uLM, 1);
  gl.uniform3fv(progWorld.u.uLight, LIGHT);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, WORLD.lmTex);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindVertexArray(WORLD.vao);
  let state = '';
  for (const g of WORLD.groups) {
    if (g.kind !== state) {
      state = g.kind;
      if (state === 'masked') gl.disable(gl.CULL_FACE);
      if (state === 'trans') { gl.enable(gl.BLEND); gl.depthMask(false); }
    }
    if (state === 'trans') gl.blendFunc(gl.SRC_ALPHA, g.additive ? gl.ONE : gl.ONE_MINUS_SRC_ALPHA);
    gl.uniform1f(progWorld.u.uAlpha, state === 'trans' ? g.amt / 255 : 1);
    gl.uniform1f(progWorld.u.uMasked, state === 'masked' ? 1 : 0);
    gl.bindTexture(gl.TEXTURE_2D, (TEX[g.name] || fallbackTex).tex);
    gl.drawArrays(gl.TRIANGLES, g.first, g.count);
  }
  gl.disable(gl.BLEND); gl.depthMask(true);
  gl.bindVertexArray(null);
}

// ---------------------------------------------------------------- Hauptschleife
let last = 0, fpsAcc = 0, fpsN = 0;
const STEP = 1 / 125;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000 || 0);
  last = now;
  if (playing) {
    readKeys();
    const n = Math.max(1, Math.ceil(dt / STEP)), h = dt / n;
    for (let i = 0; i < n; i++) playerMove(h);
    player.stepSmooth *= Math.exp(-dt * 14);
    if (Math.abs(player.stepSmooth) < 0.05) player.stepSmooth = 0;
  }
  render();
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) {
    const fps = Math.round(fpsN / fpsAcc);
    if (settings.fps) $('#stats').innerHTML = `${fps} fps · ${(fpsAcc / fpsN * 1000).toFixed(1)} ms<br>${canvas.width}×${canvas.height}`;
    fpsAcc = 0; fpsN = 0;
  }
  const spd = Math.round(Math.hypot(player.v[0], player.v[1]));
  $('#speedo').innerHTML = playing ? `${spd} <small>u/s</small>` : '';
}

// ---------------------------------------------------------------- Start
(async () => {
  const bar = $('#loadbar'), txt = $('#loadtxt');
  const step = (pct, msg) => { bar.style.width = pct + '%'; txt.textContent = msg; return new Promise(r => setTimeout(r, 0)); };
  await step(5, 'Entpacke Daten …');
  const { man, part } = await loadPack();
  await step(20, 'Lese de_dust …');
  BSP = parseBSP(part(man.bsp));
  await step(35, 'Lade Texturen …');
  const names = Object.keys(man.textures);
  let i = 0;
  for (const k of names) {
    const t = man.textures[k];
    TEX[k] = await loadTexture(part(t.data), t.type);
    if (++i % 6 === 0) await step(35 + 40 * i / names.length, 'Lade Texturen … ' + i + '/' + names.length);
  }
  { const c = document.createElement('canvas'); c.width = c.height = 16; const x = c.getContext('2d');
    x.fillStyle = '#8a8070'; x.fillRect(0, 0, 16, 16); x.fillStyle = '#6d6556'; x.fillRect(0, 0, 8, 8); x.fillRect(8, 8, 8, 8);
    const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
    gl.generateMipmap(gl.TEXTURE_2D); fallbackTex = { tex: t, w: 16, h: 16 }; }
  for (const [k, r] of Object.entries(man.sky)) SKYTEX[k] = await loadTexture(part(r), 'image/jpeg', { repeat: false, mips: false });
  await step(80, 'Baue Geometrie und Licht …');
  WORLD = buildWorld(BSP, TEX);
  SKY = buildSky(man.skyYaw || 0);
  // feste Brush-Entities fuer die Kollision
  SOLIDS = BSP.entities.filter(e => e.model && e.model[0] === '*' && !NONSOLID_CLASSES.has(e.classname) &&
    !HIDDEN_CLASSES.has(e.classname) && !(e.classname || '').startsWith('trigger_'))
    .map(e => ({ model: BSP.models[+e.model.slice(1)], origin: vec3(e.origin), cls: e.classname }));
  findSpots();
  buildTeleportButtons();
  teleport('ct');
  await step(100, `Bereit · ${WORLD.tris.toLocaleString('de-DE')} Dreiecke · Lightmap ${WORLD.lmSize[0]}×${WORLD.lmSize[1]}`);
  const sb = $('#startBtn');
  sb.disabled = false;
  sb.addEventListener('click', () => {
    $('#start').classList.remove('show');
    $('#hud').classList.add('show');
    playing = true;
    refreshMenu();
    toast(IS_TOUCH ? 'Links laufen · rechts umschauen' : 'Klick ins Bild fängt die Maus');
  });
  requestAnimationFrame(t => { last = t; frame(t); });
  // Test-Schnittstelle (fuer automatische Tests)
  window.__cs = { player, input, teleport, trace, SPOTS, WORLD, BSP, start: () => sb.click(), setLight: v => LIGHT.splice(0, 3, ...v) };
})();
</script>
